name: Amazon SageMaker
description: Amazon SageMaker is a fully managed machine learning platform that enables developers and
  data scientists to build, train, and deploy machine learning models at scale. SageMaker removes the
  heavy lifting from each step of the machine learning process, providing built-in algorithms, managed
  Jupyter notebooks, distributed training, automatic model tuning, and one-click deployment to production
  endpoints with auto-scaling.
