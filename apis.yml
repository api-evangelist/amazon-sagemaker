- type: Features
  data:
  - name: SageMaker Studio
    description: Fully integrated development environment for ML work with notebooks,
      debugging, and experiment tracking.
  - name: SageMaker HyperPod
    description: Purpose-built infrastructure for distributed training that reduces
      foundation model training time by up to 40%.
  - name: SageMaker JumpStart
    description: Hub providing access to foundation models, pre-built algorithms,
      and one-click deployment.
  - name: SageMaker Autopilot
    description: Automated model creation with complete visibility and transparency.
  - name: SageMaker Canvas
    description: No-code visual interface for creating ML models without writing code.
  - name: SageMaker Feature Store
    description: Store, share, and manage features for machine learning models.
  - name: SageMaker Data Wrangler
    description: Data preparation tool that reduces transformation workflow time significantly.
  - name: SageMaker Ground Truth
    description: Incorporates human feedback throughout the ML lifecycle for data
      labeling.
  - name: SageMaker Pipelines
    description: Purpose-built CI/CD service for machine learning workflows.
  - name: SageMaker Model Monitor
    description: Automatically detects concept drift and data quality issues in deployed
      models.
  - name: SageMaker Clarify
    description: Provides machine learning explainability and bias detection.
  - name: SageMaker Experiments
    description: Streamlines tracking and management of ML experiments.
  - name: ML Governance
    description: Access controls and transparency across the full ML lifecycle with
      audit trails.
- type: UseCases
  data:
  - name: Generative AI Applications
    description: Build custom generative AI applications using proprietary data with
      foundation model fine-tuning.
  - name: ML Model Development
    description: Train and deploy ML models across the entire machine learning lifecycle
      from exploration to production.
  - name: Data Analytics
    description: Query and analyze data across unified sources with built-in SQL analytics
      and data processing.
  - name: Enterprise AI Governance
    description: Manage data and AI artifacts with fine-grained security controls
      and compliance tooling.
  - name: Computer Vision
    description: Build and deploy computer vision models for image classification,
      object detection, and segmentation.
  - name: Natural Language Processing
    description: Train and deploy NLP models for text classification, entity recognition,
      and language generation.
  - name: Fraud Detection
    description: Build real-time fraud detection models with low-latency inference
      endpoints.
  - name: Predictive Maintenance
    description: Deploy ML models on edge devices for predictive maintenance use cases.
- type: Integrations
  data:
  - name: Amazon S3
    description: Store training data, model artifacts, and inference outputs in Amazon
      S3 data lakes.
  - name: Amazon Redshift
    description: Zero-ETL integration for near real-time data ingestion from Redshift
      warehouses.
  - name: Amazon ECR
    description: Store and manage Docker containers for custom training and inference
      environments.
  - name: AWS Lambda
    description: Trigger ML inference pipelines and post-processing workflows with
      Lambda functions.
  - name: Amazon EventBridge
    description: Trigger SageMaker pipelines and workflows based on events.
  - name: AWS Step Functions
    description: Orchestrate multi-step ML workflows using Step Functions state machines.
  - name: Apache Iceberg
    description: Lakehouse architecture supporting Apache Iceberg-compatible data
      tools.
  - name: Amazon DataZone
    description: SageMaker Catalog built on Amazon DataZone for data discovery and
      governance.
  - name: Amazon Q Developer
    description: Natural language assistance integrated into SageMaker Unified Studio.
  - name: Hugging Face
    description: Deploy Hugging Face models directly via SageMaker JumpStart.
