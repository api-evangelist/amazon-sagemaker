  deleteTrainingJob(trainingJobName: String!): DeleteResult

  # Model
  createModel(input: CreateModelInput!): Model
  deleteModel(modelName: String!): DeleteResult

  # Model Package
  createModelPackage(input: CreateModelPackageInput!): ModelPackage
  createModelPackageGroup(input: CreateModelPackageGroupInput!): ModelPackageGroup
  updateModelPackage(modelPackageName: String! modelApprovalStatus: String approvalDescription: String): ModelPackage
  deleteModelPackage(modelPackageName: String!): DeleteResult
  deleteModelPackageGroup(modelPackageGroupName: String!): DeleteResult

  # Endpoint
  createEndpointConfig(input: CreateEndpointConfigInput!): EndpointConfig
  createEndpoint(input: CreateEndpointInput!): Endpoint
  updateEndpoint(endpointName: String! endpointConfigName: String!): Endpoint
  deleteEndpointConfig(endpointConfigName: String!): DeleteResult
  deleteEndpoint(endpointName: String!): DeleteResult

  # Transform
  createTransformJob(input: CreateTransformJobInput!): TransformJob
  stopTransformJob(transformJobName: String!): StopResult

  # Compilation
  createCompilationJob(input: CreateCompilationJobInput!): CompilationJob
  stopCompilationJob(compilationJobName: String!): StopResult
  deleteCompilationJob(compilationJobName: String!): DeleteResult

  # Tuning
  createHyperParameterTuningJob(input: CreateHyperParameterTuningJobInput!): HyperParameterTuning
  stopHyperParameterTuningJob(hyperParameterTuningJobName: String!): StopResult
  deleteHyperParameterTuningJob(hyperParameterTuningJobName: String!): DeleteResult

  # Pipeline
  createPipeline(input: CreatePipelineInput!): Pipeline
  updatePipeline(pipelineName: String! pipelineDefinition: String pipelineDescription: String roleArn: AmazonResourceName): Pipeline
  deletePipeline(pipelineName: String!): DeleteResult
  startPipelineExecution(pipelineName: String! pipelineExecutionDisplayName: String pipelineParameters: [PipelineParameterInput] parallelismConfiguration: ParallelismConfigurationInput): PipelineExecution
  stopPipelineExecution(pipelineExecutionArn: AmazonResourceName!): StopResult

  # Feature Store
  createFeatureGroup(input: CreateFeatureGroupInput!): FeatureGroup
  updateFeatureGroup(featureGroupName: String! featureAdditions: [FeatureDefinitionInput]): FeatureGroup
  deleteFeatureGroup(featureGroupName: String!): DeleteResult
  putRecord(featureGroupName: String! record: [FeatureValueInput!]!): PutRecordResult
  deleteRecord(featureGroupName: String! recordIdentifierValueAsString: String! eventTime: String!): DeleteResult

  # Experiment / Trial
  createExperiment(experimentName: String! displayName: String description: String tags: [TagInput]): Experiment
  deleteExperiment(experimentName: String!): DeleteResult
  createTrial(trialName: String! experimentName: String! displayName: String tags: [TagInput]): Trial
  deleteTrial(trialName: String!): DeleteResult
  createTrialComponent(input: CreateTrialComponentInput!): TrialComponent
  deleteTrialComponent(trialComponentName: String!): DeleteResult
  associateTrialComponent(trialComponentName: String! trialName: String!): AssociateResult
  disassociateTrialComponent(trialComponentName: String! trialName: String!): DisassociateResult

  # Lineage
  createArtifact(artifactName: String source: ArtifactSourceInput! artifactType: String! properties: JSON tags: [TagInput]): Artifact
  deleteArtifact(artifactArn: AmazonResourceName source: ArtifactSourceInput): DeleteResult
  createAction(actionName: String! source: ActionSourceInput! actionType: String! description: String status: String properties: JSON tags: [TagInput]): Action
  deleteAction(actionName: String!): DeleteResult
  createContext(contextName: String! source: ContextSourceInput! contextType: String! description: String properties: JSON tags: [TagInput]): Context
  deleteContext(contextName: String!): DeleteResult
  addAssociation(sourceArn: AmazonResourceName! destinationArn: AmazonResourceName! associationType: AssociationEdgeType): Association
  deleteAssociation(sourceArn: AmazonResourceName! destinationArn: AmazonResourceName!): DeleteResult

  # Processing
  createProcessingJob(input: CreateProcessingJobInput!): ProcessingJob
  stopProcessingJob(processingJobName: String!): StopResult

  # Monitoring
  createMonitoringSchedule(input: CreateMonitoringScheduleInput!): MonitoringSchedule
  updateMonitoringSchedule(monitoringScheduleName: String! monitoringScheduleConfig: MonitoringScheduleConfigInput!): MonitoringSchedule
  deleteMonitoringSchedule(monitoringScheduleName: String!): DeleteResult
  startMonitoringSchedule(monitoringScheduleName: String!): StartResult
  stopMonitoringSchedule(monitoringScheduleName: String!): StopResult

  # Inference Experiment
  createInferenceExperiment(input: CreateInferenceExperimentInput!): InferenceExperiment
  updateInferenceExperiment(name: String! description: String schedule: InferenceExperimentScheduleInput modelVariants: [ModelVariantConfigInput] dataStorageConfig: InferenceExperimentDataStorageConfigInput shadowModeConfig: ShadowModeConfigInput): InferenceExperiment
  startInferenceExperiment(name: String!): InferenceExperiment
  stopInferenceExperiment(name: String! modelVariantActions: JSON desiredModelVariants: [ModelVariantConfigInput] desiredState: String reason: String): InferenceExperiment
  deleteInferenceExperiment(name: String!): DeleteResult

  # Project
  createProject(input: CreateProjectInput!): Project
  updateProject(projectName: String! projectDescription: String serviceCatalogProvisioningUpdateDetails: ServiceCatalogProvisioningDetailsInput tags: [TagInput]): Project
  deleteProject(projectName: String!): DeleteResult

  # Domain / Space / User
  createDomain(input: CreateDomainInput!): Domain
  updateDomain(domainId: String! defaultUserSettings: UserSettingsInput domainSettingsForUpdate: DomainSettingsForUpdateInput appSecurityGroupManagement: String defaultSpaceSettings: DefaultSpaceSettingsInput): Domain
  deleteDomain(domainId: String! retentionPolicy: RetentionPolicyInput): DeleteResult
  createSpace(domainId: String! spaceName: String! spaceSettings: SpaceSettingsInput ownershipSettings: OwnershipSettingsInput spaceSharingSettings: SpaceSharingSettingsInput spaceDisplayName: String tags: [TagInput]): Space
  updateSpace(domainId: String! spaceName: String! spaceSettings: SpaceSettingsInput spaceDisplayName: String): Space
  deleteSpace(domainId: String! spaceName: String!): DeleteResult
  createUserProfile(domainId: String! userProfileName: String! singleSignOnUserIdentifier: String singleSignOnUserValue: String userSettings: UserSettingsInput tags: [TagInput]): UserProfile
  updateUserProfile(domainId: String! userProfileName: String! userSettings: UserSettingsInput): UserProfile
  deleteUserProfile(domainId: String! userProfileName: String!): DeleteResult

  # Tags
  addTags(resourceArn: AmazonResourceName! tags: [TagInput!]!): AddTagsResult
  deleteTags(resourceArn: AmazonResourceName! tagKeys: [String!]!): DeleteResult
  listTags(resourceArn: AmazonResourceName! maxResults: Int nextToken: String): TagList
}

